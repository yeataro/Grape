<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="title desc">
<title id="title">UIR-02 to UIR-04 state schematics</title><desc id="desc">Failure and state ownership schematics, not screenshots: missing modules preserve data while preventing generation; unfinished field text does not become a model value; two editor contexts share model changes while retaining independent selection and camera.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#27343c;font-size:16px}.title{font-size:23px;font-weight:700}.heading{font-size:18px;font-weight:700}.small{font-size:13px}.muted{fill:#61727d}.box{fill:white;stroke:#8d9fa9;stroke-width:1.4}.warn{fill:#fbf4ee;stroke:#a76b4b;stroke-width:1.5}</style></defs>
<rect width="1280" height="690" fill="#f3f5f7"/><text x="24" y="35" class="title">UIR-02–04 — HANDOFF STATE SCHEMATICS</text><text x="24" y="61" class="muted">Structural / behavioral obligations. Colors, dimensions and decoration are Replaceable.</text>
<rect x="24" y="90" width="564" height="505" rx="7" class="box"/><text x="43" y="122" class="heading">UIR-02 [B] Error and missing-module state</text>
<rect x="44" y="144" width="524" height="79" rx="5" class="warn"/><text x="60" y="172">Cannot generate current revision</text><text x="60" y="198" class="small">Details · exact stage / occurrence / node target</text>
<rect x="95" y="255" width="309" height="144" rx="6" class="warn"/><text x="112" y="285" class="heading">Missing module</text><text x="112" y="316">external.module / node-type</text><text x="112" y="344">Exact version + fingerprint retained</text><text x="112" y="374" class="small">Opaque state / references are not deleted.</text>
<text x="44" y="442">[S] Save repairable document: allowed.</text><text x="44" y="473">[B] Generate / Apply success: not allowed.</text><text x="44" y="505">[B] Old successful output ≠ current success.</text><text x="44" y="550" class="small muted">A toast about export cannot clear this persistent error.</text>
<rect x="609" y="90" width="647" height="231" rx="7" class="box"/><text x="631" y="122" class="heading">UIR-03 [B] Draft text is not a model value</text><text x="631" y="159">Field shows:</text><rect x="785" y="137" width="201" height="35" rx="5" class="box"/><text x="800" y="162">1e-</text><text x="1010" y="162" class="small">not committed</text><text x="631" y="202">Model value remains: 1</text><text x="631" y="236" class="small">Enter after composition → parse / validate → Parameter.write.</text><text x="631" y="269" class="small">Cancel restores presentation; stale target rejects instead of overwriting.</text>
<rect x="609" y="342" width="647" height="253" rx="7" class="box"/><text x="631" y="375" class="heading">UIR-04 [S] Two Contexts, one Graph</text><rect x="639" y="398" width="258" height="80" rx="5" fill="#e8f0f2"/><text x="653" y="426">Canvas A / Context A</text><text x="653" y="451" class="small">selection = node 1 · camera A</text><rect x="922" y="398" width="310" height="80" rx="5" fill="#e8f0f2"/><text x="938" y="426">Canvas B / Context B</text><text x="938" y="451" class="small">selection = node 2 · camera B</text><text x="632" y="515">Shared model / edges / values / History</text><text x="632" y="545" class="small">A edits value → B sees value, not A selection or camera.</text><text x="632" y="571" class="small">Inspector follows explicit active context. Closing A does not delete Graph.</text>
<text x="24" y="635" class="small">S Structural · B Behavioral · P Preference · R Replaceable</text><text x="24" y="661" class="small muted">These images specify states to test; they are not evidence that a browser renderer or Legacy UI already passed.</text>
</svg>
