<rect x="335" y="259" width="224" height="205" rx="6" class="card selected"/><rect x="335" y="259" width="224" height="40" rx="6" class="tag"/><text x="352" y="285" font-weight="700">Multiply</text><text x="352" y="325">name: Multiply_1</text><circle cx="335" cy="354" r="7" fill="#fff" stroke="#72919b" stroke-width="3"/><text x="353" y="359">a  float · connected</text><circle cx="335" cy="393" r="7" fill="#fff" stroke="#72919b" stroke-width="3"/><text x="353" y="398">b  float · local 1</text><text x="485" y="439">out</text><circle cx="559" cy="434" r="7" fill="#fff" stroke="#72919b" stroke-width="3"/>
<rect x="649" y="339" width="174" height="119" rx="6" class="card"/><text x="665" y="368" font-weight="700">Output</text><text x="665" y="389" class="small">protected boundary</text><circle cx="649" cy="422" r="7" fill="#fff" stroke="#72919b" stroke-width="3"/><text x="666" y="427">color  vec4</text>
<path d="M273 392C294 392 303 354 325 354" class="wire"/><path d="M567 434C601 434 606 422 639 422" class="wire"/>
<text x="42" y="522" class="small">[B] Drag one gesture → one model operation. Reject invalid edge → retain previous graph.</text><text x="42" y="546" class="small muted">[R] Coordinates, card decoration and this palette are explanatory, not required visual tokens.</text>
<rect x="882" y="148" width="374" height="425" rx="5" class="border"/><text x="900" y="179" font-weight="700">[S] Inspector → Context A primary</text><text x="900" y="205">Multiply / Multiply_1</text><line x1="899" y1="221" x2="1237" y2="221" stroke="#bac6ce"/>
<text x="900" y="254">a · float</text><rect x="995" y="233" width="240" height="37" rx="5" fill="#e8f0f2"/><text x="1006" y="257">Source_1 · out  ↗</text><text x="997" y="288" class="small muted">[B] Navigate source ≠ Disconnect</text>
<text x="900" y="324">b · float</text><rect x="995" y="302" width="240" height="39" rx="5" class="border"/><text x="1007" y="328">1</text><text x="900" y="373" class="small">[B] Uncommitted text stays in FieldDraft.</text><text x="900" y="397" class="small">Commit → Parameter.write → Graph.</text><text x="900" y="439" class="small">[S] Missing schema → empty / fallback.</text><text x="900" y="463" class="small">Never write a previous target by name.</text><text x="900" y="528" class="small muted">[R] Renderer, icons, spacing may change.</text>
<rect x="24" y="590" width="1232" height="78" rx="5" class="border"/><text x="42" y="617" font-weight="700">[B] Status / diagnostics</text><text x="42" y="645">Graph dirty · Generated result for revision N · Host not connected · Export is not Apply</text>
<text x="24" y="709" class="small">S Structural · B Behavioral · P Preference · R Replaceable</text><text x="24" y="735" class="small muted">P: theme, panel layout and optional Overview remain separate from Graph model history. Code view is read-only.</text>
