<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">UIR-01 handoff workspace schematic</title><desc id="desc">A structural Canvas and Inspector diagram, not a screenshot or a visual redesign. Two real nodes connect to a protected Output. Inspector reads a selected node. UI commands do not own Graph state.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#72919b"/></marker><style>text{font-family:Arial,sans-serif;fill:#24323a;font-size:15px}.title{font-size:23px;font-weight:700}.small{font-size:12px}.muted{fill:#596e79}.border{fill:#fff;stroke:#94a3ad;stroke-width:1.3}.card{fill:#f6f8fa;stroke:#82949e;stroke-width:1.5}.tag{fill:#e7eef2}.selected{stroke:#356978;stroke-width:3}.wire{fill:none;stroke:#72919b;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="760" fill="#f3f5f7"/>
<text x="24" y="34" class="title">UIR-01 — HANDOFF SCHEMATIC</text><text x="24" y="58" class="muted">Structure and behavior reference. Not a legacy screenshot, shipped UI, or pixel specification.</text>
<rect x="24" y="80" width="1232" height="52" rx="5" class="border"/>
<text x="42" y="112">[S] Graph: Example</text><text x="240" y="112">Stage: Pixel</text><text x="390" y="112">[B] Add · Undo · Redo</text><text x="660" y="112">Generate / Code</text><text x="877" y="112">Save / Export</text><text x="1080" y="112">Host: unavailable</text>
<rect x="24" y="148" width="840" height="425" rx="5" class="border"/><text x="42" y="177" font-weight="700">[S] Canvas → Context A → shared Graph</text><text x="42" y="198" class="small muted">Selection / navigation: Context · pan / zoom: view · nodes / edges: Graph</text>
